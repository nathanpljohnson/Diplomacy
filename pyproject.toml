[project]
name = "entente-diplomacy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["diplomacy==1.1.2", "Flask==3.1.3", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.8", "qstash==3.4.0"]

[tool.vercel.scripts]
build = "python build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
